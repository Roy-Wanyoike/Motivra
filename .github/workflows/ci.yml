name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full history for the commit range)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify DCO sign-offs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash scripts/check_dco.sh "${{ github.event.pull_request.base.sha }}" HEAD
          else
            bash scripts/check_dco.sh "${{ github.event.before }}" HEAD
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          args: --timeout 5m

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: motivra
          POSTGRES_PASSWORD: motivra
          POSTGRES_DB: motivra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://motivra:motivra@localhost:5432/motivra_test?sslmode=disable
      TEST_DATABASE_URL: postgres://motivra:motivra@localhost:5432/motivra_test?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        # -tags tools loads the root package (tools.go), which proves the
        # pinned shared dependencies compile and keeps ./... non-empty while
        # the skeleton has no other Go sources.
        run: go build -tags tools ./...

      - name: Vet
        run: go vet -tags tools ./...

      - name: Test with coverage
        run: go test -race -tags tools -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: |
          if [ -f coverage.out ]; then
            go tool cover -func=coverage.out | tail -1
          else
            echo "No coverage profile yet (no Go test packages in the skeleton). Threshold enforcement lands with the first real code."
          fi

  migrations:
    name: Migration validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate migrations
        run: bash scripts/validate_migrations.sh

  customer:
    name: Customer app (tsc + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/customer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/customer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  technician:
    name: Technician app (tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/technician
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/technician/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
