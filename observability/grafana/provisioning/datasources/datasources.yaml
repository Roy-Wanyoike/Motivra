apiVersion: 1

datasources:
  - name: Prometheus
    uid: motivra-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: Loki
    uid: motivra-loki
    type: loki
    access: proxy
    url: http://loki:3100

  - name: Tempo
    uid: motivra-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: motivra-loki
        filterByTraceID: true
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
