openapi: 3.0.3
info:
  title: Motivra Identity API
  version: 1.0.0
  description: |
    Authentication and account management for Motivra (ADR-0004 security
    baseline). Access tokens are short-lived asymmetric JWTs (EdDSA/RS256,
    15 minutes, ADR-0007) issued by this service; verifying services hold
    the public keys only, via /.well-known/jwks.json. Refresh tokens are
    opaque 256-bit strings (30 days, rotated on every use, stored only as
    keyed HMAC-SHA256 digests). New passwords are checked against breach
    corpora before hashing (ADR-0004, issue #86); accounts verify their
    email/phone channels through single-use tokens, and refresh sessions
    are refused once the post-registration grace window ends until every
    present channel is verified. All error responses use RFC 7807-style
    application/problem+json bodies.
servers:
  - url: /
    description: Same-origin deployment behind the platform gateway.
tags:
  - name: auth
    description: Token issuance, rotation, revocation and refresh-session management.
  - name: users
    description: Authenticated account access and admin listing.
  - name: audit
    description: Admin read surface over the append-only audit trail (issue 88, ADR-0004).
  - name: technician-verification
    description: >-
      Technician skill-verification status and decisions (issue #166) —
      staff-only, audit-logged writes; the technician reads their own status.
paths:
  /v1/auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account and receive the first token pair
      description: >
        Emails are stored lowercased; a CUSTOMER role is granted initially.
        Duplicate emails (case-insensitive) and duplicate phone numbers
        yield 409. The password is checked against breach corpora (local
        denylist, plus the HIBP k-anonymity range API when enabled) before
        hashing; known-breached passwords yield 422 with a "breached" field
        issue. One single-use verification token per present contact
        channel (email, and phone when given) is issued; raw tokens are
        delivered out-of-band and appear in the response only when the
        dev-only token echo is enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created; token pair issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessResponse'
        '409':
          description: Email or phone already registered.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation failed (email format, password policy, missing name, breached password).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Breach check unavailable and the deployment fails closed (MOTIVRA_BREACH_FAIL_CLOSED).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Authenticate with email and password
      description: >
        Unknown emails and wrong passwords return the identical 401 body so
        account existence is never disclosed. Suspended or deleted accounts
        return 403 only after the password has been verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated; fresh token pair issued and audited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessResponse'
        '401':
          description: Invalid credentials.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Account is not active.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Malformed request body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/auth/refresh:
    post:
      operationId: refresh
      tags: [auth]
      summary: Rotate a refresh session
      description: >
        Presents an opaque refresh token and receives a fresh pair. The
        presented session is revoked (rotation); reuse of a rotated, revoked
        or expired token returns 401. Accounts that are still unverified
        after the post-registration grace window (MOTIVRA_VERIFICATION_GRACE,
        default 24h) are refused with 403 until every present contact
        channel is verified; the refusal consumes nothing, so the same token
        refreshes once verification completes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessResponse'
        '401':
          description: Unknown, revoked, reused or expired refresh token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Account is not active, or verification is required after the grace window ended.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Malformed request body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/auth/verify:
    post:
      operationId: verify
      tags: [auth]
      summary: Consume a single-use verification token (issue #86)
      description: >
        Marks the token's channel (email or phone) verified for the owning
        account. Tokens are single-use: unknown, expired, already-consumed
        and raced tokens all return the identical 401 so token state is
        never disclosed. Consumption and the channel timestamp land in one
        transaction; the event is audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '200':
          description: Channel verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
        '401':
          description: Token is unknown, expired or already consumed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Missing token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/auth/verification/resend:
    post:
      operationId: resendVerification
      tags: [auth]
      summary: Re-issue a verification token (issue #86)
      description: >
        Re-issues a single-use token for the account behind the given email
        (channel defaults to email; phone applies to accounts with a phone).
        Rate-limited per user and channel (cooldown + rolling limit) and
        per IP; exceeding the limits yields 429. Unknown emails and
        channels that need no token return a neutral 202 so the endpoint
        cannot enumerate accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
      responses:
        '202':
          description: Resend accepted; the body is neutral for unknown emails. Token fields appear only with the dev-only echo enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendVerificationResponse'
        '422':
          description: Missing email or invalid channel.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Resend cooldown active or rolling limit reached.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/auth/password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the authenticated caller's password (issue #86)
      description: >
        Verifies the current password, breach-checks the new one BEFORE
        hashing (ADR-0004), persists it and revokes every live session of
        the user — including the caller's — so all devices re-authenticate.
        Audited.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed; all sessions revoked.
        '401':
          description: Missing/invalid access token, or the current password is incorrect.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: New password violates the policy or is breached.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Breach check unavailable and the deployment fails closed (MOTIVRA_BREACH_FAIL_CLOSED).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the session behind a refresh token
      description: >
        Possession of the refresh token is the logout credential. Returns
        204 on success; unknown or already-revoked tokens return 401 so the
        endpoint never reveals session state. Revocation is audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Session revoked.
        '401':
          description: Unknown or already-revoked refresh token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Missing refresh_token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/auth/sessions:
    get:
      operationId: listSessions
      tags: [auth]
      summary: List the authenticated caller's refresh sessions
      description: >
        Every refresh session of the caller — including revoked ones, which
        render as "signed out" devices. The session behind the presented
        access token carries current=true. Responses never contain
        credential material (refresh tokens are stored only as digests).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller's sessions, newest-first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        '401':
          description: Missing or invalid access token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      operationId: revokeAllSessions
      tags: [auth]
      summary: Revoke every live session of the caller (sign-out everywhere)
      description: >
        Revokes all of the caller's live refresh sessions, including the
        session behind the presented access token. Refresh rotation and
        login with an existing device token are refused afterwards; the
        still-valid access token expires within one access TTL. Audited
        (identity.session.revoked_all) with the revoked count.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Number of sessions revoked by this call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeAllResponse'
        '401':
          description: Missing or invalid access token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/auth/sessions/{sessionID}:
    delete:
      operationId: revokeSession
      tags: [auth]
      summary: Revoke one of the caller's refresh sessions by id
      description: >
        Revokes the named refresh session (204). Unknown ids and other
        users' sessions yield the identical 404 — ownership is scoped in
        the service layer and session existence is never disclosed across
        accounts. Audited (identity.session.revoked).
      security:
        - bearerAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Session revoked.
        '401':
          description: Missing or invalid access token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No session with this id belongs to the caller.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: sessionID is not a UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /.well-known/jwks.json:
    get:
      operationId: getJWKS
      tags: [auth]
      summary: The issuer's public signing keys (JWKS, ADR-0007)
      description: >
        JSON Web Key Set of the asymmetric signing keys (EdDSA/RS256) — the
        only trust anchor verifying services need. Carries public material
        only. Validators cache it (5-minute refresh, bounded unknown-kid
        refetch) and pick up rotated kids without restarts; the rotation
        procedure is RUNBOOK §8a.
      responses:
        '200':
          description: The current key set (RFC 7517 JWK Set).
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    description: Public JWKs, each with kid/kty/alg/crv or n&e/use.
                    items:
                      type: object
                      additionalProperties: true
        '404':
          description: Legacy HS256 signing is configured (no asymmetric key set exists).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/users/me:
    get:
      operationId: getProfile
      tags: [users]
      summary: Get the authenticated caller's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller's profile. Credential material is never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Missing or invalid access token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The token subject no longer exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/admin/users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List accounts (ADMIN or SUPER_ADMIN)
      description: Newest-first, offset-based pagination. limit is clamped to
        1-100 (default 20); offset floors at 0. The privileged read is
        itself audited (issue 88, ADR-0004) as identity.users.listed with
        the acting admin, their tenant scope and the page shape.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: One page of accounts with their roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '401':
          description: Missing or invalid access token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Caller lacks ADMIN or SUPER_ADMIN.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: limit or offset is not an integer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/admin/audit:
    get:
      operationId: listAuditRecords
      tags: [audit]
      summary: Read the append-only audit trail (ADMIN or SUPER_ADMIN)
      description: |
        One filtered, paginated page of the platform's write-once audit
        trail (issue #88), newest first (created_at DESC, id DESC). The
        trail covers identity lifecycle events, privileged admin reads
        (including the account directory listing itself), dispatch
        decision records (inputs hash, chosen technician, score) and job
        assignment records written by the other domains.

        Filters are exact-match: action, object_type, object_id, actor_id;
        since (created_at >= since) and until (created_at < until) take
        RFC 3339 timestamps; limit is clamped to 1-100 (default 20) and
        offset floors at 0.

        Tenant scope is derived from the validated access token, never
        from the caller: an ADMIN whose token carries a tenant_id claim is
        always filtered to that tenant and no query parameter widens it. A
        SUPER_ADMIN reads the platform-wide trail and may narrow it with
        the tenant_id query parameter. A malformed tenant claim is an
        authentication failure (fail closed).
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: false
          description: Exact action match, e.g. dispatch.decision.scored.
          schema:
            type: string
        - name: object_type
          in: query
          required: false
          schema:
            type: string
        - name: object_id
          in: query
          required: false
          schema:
            type: string
        - name: actor_id
          in: query
          required: false
          description: Exact acting-principal match (UUID).
          schema:
            type: string
            format: uuid
        - name: tenant_id
          in: query
          required: false
          description: >
            Tenant narrowing filter. Honoured only for SUPER_ADMIN (an
            ADMIN is always bound to their own tenant claim, so this
            parameter cannot widen their scope).
          schema:
            type: string
            format: uuid
        - name: since
          in: query
          required: false
          description: Return rows with created_at at or after this instant.
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          description: Return rows with created_at strictly before this instant.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: One page of audit records, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditList'
        '401':
          description: Missing or invalid access token (including a malformed tenant claim).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Caller lacks ADMIN or SUPER_ADMIN.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: A filter or pagination parameter is malformed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/technician/verification-status:
    get:
      operationId: getTechnicianVerificationStatus
      tags: [technician-verification]
      summary: The caller's own verification status
      description: |
        Returns the authenticated caller's current verification lifecycle
        (issue #166): the status plus the newest decision record when one
        exists. The subject is always the caller — there is no technician
        id parameter, so the read cannot be widened. Technicians who were
        never assessed read as `unverified` with null timestamps and a null
        record (the fail-closed default dispatch relies on).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller's verification status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnicianVerificationStatusRead'
        '401':
          description: Missing or invalid access token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/admin/technicians/{technicianID}/verification/approve:
    post:
      operationId: approveTechnicianVerification
      tags: [technician-verification]
      summary: Record a VERIFIED outcome for a technician (staff only, audit-logged)
      description: |
        A verifier-role operator (ADMIN or SUPER_ADMIN — the role decision of
        record for #166: verification reuses the fixed role set, no dedicated
        VERIFIER role) grants the technician's skill verification.

        One transaction writes the append-only decision record, stamps
        `users.verification_status` to `verified` and appends the
        `identity.technician.verification.approved` audit_log entry (actor,
        target, redacted reason, evidence references, previous status) — a
        failed audit write fails the request and changes nothing
        (ADR-0004 fail-closed auditing). Records are never mutated; a later
        decision appends a new superseding record.

        Authorization is enforced in the service, not only at the
        middleware, so a refused attempt is itself audited
        (`identity.technician.verification.denied`): any other role —
        including the technician themselves — gets 403, and an actor can
        never decide their own status (separation of duties).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TechnicianID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechnicianVerificationDecision'
      responses:
        '201':
          description: Outcome recorded; record + status stamp + audit entry committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnicianVerificationRecord'
        '401':
          description: Missing or invalid access token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Caller's role may not record decisions, or self-verification (audited).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Unknown technician, or the target holds no TECHNICIAN role.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Malformed ids or out-of-bounds input.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: The decision could not be committed with its audit row; nothing changed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/admin/technicians/{technicianID}/verification/reject:
    post:
      operationId: rejectTechnicianVerification
      tags: [technician-verification]
      summary: Record a REJECTED outcome for a technician (staff only, audit-logged)
      description: |
        Same discipline as approve, recording `rejected`: a non-empty
        `reason` is REQUIRED (a rejection without a reason is unusable to
        the technician), the audit action is
        `identity.technician.verification.rejected`, and the technician's
        status stamp follows the newest record. `rejected` is
        dispatch-ineligible (fail-closed).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TechnicianID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechnicianVerificationDecision'
      responses:
        '201':
          description: Outcome recorded; record + status stamp + audit entry committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnicianVerificationRecord'
        '401':
          description: Missing or invalid access token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Caller's role may not record decisions, or self-verification (audited).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Unknown technician, or the target holds no TECHNICIAN role.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Malformed ids, missing reason or out-of-bounds input.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: The decision could not be committed with its audit row; nothing changed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  parameters:
    TechnicianID:
      name: technicianID
      in: path
      required: true
      description: The assessed technician's account id (must hold the TECHNICIAN role).
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by /v1/auth/login or /v1/auth/register —
        asymmetric EdDSA/RS256 with a kid header (ADR-0007); HS256 exists only
        behind the explicit MOTIVRA_JWT_ALLOW_HS256 migration flag.
  schemas:
    AccessResponse:
      type: object
      required: [access_token, refresh_token, expires_at]
      properties:
        access_token:
          type: string
          description: Asymmetric JWT (EdDSA/RS256, 15 minutes, ADR-0007) carrying sub, tenant_id, role, roles, sid, iss, aud, iat, exp and a kid header; verifiers check it against the issuer's JWKS.
        refresh_token:
          type: string
          description: Opaque 256-bit base64url token (30 days), rotated on every refresh.
        expires_at:
          type: string
          format: date-time
          description: Absolute expiry of the access token.
        verification:
          type: array
          description: >
            Present only when the dev-only token echo (MOTIVRA_VERIFICATION_DEV_ECHO)
            is enabled: the raw single-use verification tokens issued by this
            registration. Production deliveries are out-of-band and never echo.
          items:
            $ref: '#/components/schemas/VerificationEcho'
    RegisterRequest:
      type: object
      required: [email, password, full_name]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          description: Optional; E.164 recommended. Unique when present.
        password:
          type: string
          minLength: 10
          maxLength: 128
          description: >
            Argon2id-hashed server-side (64 MB, t=3, p=4); never stored or
            logged in plaintext. Checked against breach corpora before
            hashing; known-breached passwords are rejected with a
            "breached" field issue.
        full_name:
          type: string
          minLength: 1
        device_name:
          type: string
          description: Optional device label recorded on the first session.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        device_name:
          type: string
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    Role:
      type: string
      enum: [CUSTOMER, TECHNICIAN, DISPATCHER, GARAGE, FLEET_ADMIN, SUPPORT, FINANCE, ADMIN, SUPER_ADMIN]
    UserStatus:
      type: string
      enum: [active, suspended, deleted]
    User:
      type: object
      required: [id, email, phone, full_name, status, roles, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        phone:
          type: string
          description: Empty when absent.
        full_name:
          type: string
        status:
          $ref: '#/components/schemas/UserStatus'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        email_verified_at:
          type: string
          format: date-time
          nullable: true
          description: When the email channel was verified; null while unverified (issue #86).
        phone_verified_at:
          type: string
          format: date-time
          nullable: true
          description: When the phone channel was verified; null while absent or unverified (issue #86).
        verification_status:
          $ref: '#/components/schemas/TechnicianVerificationStatus'
          nullable: true
          description: >-
            Technician skill-verification lifecycle attribute (issue #166).
            Null while never assessed (reads as unverified); set only by the
            audit-logged verification API. Only `verified` is
            dispatch-eligible (issue #167 fails closed on every other value).
        created_at:
          type: string
          format: date-time
    TechnicianVerificationStatus:
      type: string
      enum: [unverified, pending, verified, rejected]
      description: |
        Server-authoritative technician verification lifecycle (issue #166) —
        CONTRACT OF RECORD, owned by the identity context (ADR-0002:
        producers own schemas).

        - `unverified` — no live verification (the lifecycle start; also the
          rendering of a null attribute).
        - `pending` — an assessment is scheduled/in progress (reserved for
          the assessment-scheduling flow; fail-closed for dispatch).
        - `verified` — a live credential granted by a staff verifier; the
          ONLY dispatch-eligible value (issue #167 verified-only gate).
        - `rejected` — the latest assessment outcome was a rejection.

        Status changes are append-only decision records
        (`technician_verifications`) written with their audit_log entry in
        one transaction; the current status is their newest outcome. The
        draft technician contract (contracts/technician/openapi.yaml) spells
        the second state `assessment_pending` — that draft maps here;
        consumers MUST treat every non-`verified` value as ineligible
        (fail-closed), which makes both `pending` and `rejected` safe
        extensions.
    TechnicianVerificationDecision:
      type: object
      description: >
        One staff verification decision (issue #166). The endpoint decides
        the recorded status (approve -> verified, reject -> rejected); the
        body carries the rationale and the credential-evidence REFERENCES.
        Evidence is referenced, never stored: assessment ids point into the
        Inspections context by id only (no cross-domain FKs, ADR-0003) and
        evidence refs are opaque handles — no signed URLs, no documents,
        nothing PII (docs/PII-HANDLING.md).
      required: []
      properties:
        reason:
          type: string
          maxLength: 2000
          description: >
            Verifier rationale. REQUIRED for reject (a rejection without a
            reason is unusable to the technician); optional for approve.
            Stored in the decision record; only the platform-redacted
            projection enters audit metadata.
        assessment_template_id:
          type: string
          format: uuid
          nullable: true
          description: Inspections template used as the assessment rubric (referenced by id only).
        assessment_session_id:
          type: string
          format: uuid
          nullable: true
          description: The Inspections session that ran the assessment (referenced by id only).
        evidence_refs:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 128
          description: Opaque credential-evidence handles (at most 20, each 1-128 chars).
    TechnicianVerificationRecord:
      type: object
      description: >
        One append-only verification decision row (issue #166) — write-once
        at the database level (append-only trigger); a correction is a NEW
        superseding row and the newest record per technician wins.
      required: [id, technician_id, status, reason, actor_id, evidence_refs, created_at]
      properties:
        id:
          type: string
          format: uuid
        technician_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/TechnicianVerificationStatus'
        reason:
          type: string
          description: The verifier's rationale (empty for reason-less approvals).
        actor_id:
          type: string
          format: uuid
          description: The acting staff principal (audit attribution).
        assessment_template_id:
          type: string
          format: uuid
          nullable: true
        assessment_session_id:
          type: string
          format: uuid
          nullable: true
        evidence_refs:
          type: array
          items:
            type: string
          description: Always an array (never null), possibly empty.
        created_at:
          type: string
          format: date-time
    TechnicianVerificationStatusRead:
      type: object
      description: The caller's verification status read model (GET /v1/technician/verification-status).
      required: [technician_id, status, updated_at, verification]
      properties:
        technician_id:
          type: string
          format: uuid
          description: Always the authenticated caller (the read cannot be widened).
        status:
          $ref: '#/components/schemas/TechnicianVerificationStatus'
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: When the newest decision was recorded; null while never assessed.
        verification:
          allOf:
            - $ref: '#/components/schemas/TechnicianVerificationRecord'
          nullable: true
          description: The newest decision record; null while never assessed.
    VerifyRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: The raw single-use token delivered out-of-band.
    VerifyResponse:
      type: object
      required: [channel]
      properties:
        channel:
          $ref: '#/components/schemas/VerificationChannel'
    VerificationChannel:
      type: string
      enum: [email, phone]
    VerificationEcho:
      type: object
      required: [channel, token, expires_at]
      properties:
        channel:
          $ref: '#/components/schemas/VerificationChannel'
        token:
          type: string
          description: The raw single-use token; deliver or use it before expiry.
        expires_at:
          type: string
          format: date-time
    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        channel:
          $ref: '#/components/schemas/VerificationChannel'
    ResendVerificationResponse:
      type: object
      required: [channel]
      properties:
        channel:
          $ref: '#/components/schemas/VerificationChannel'
        token:
          type: string
          description: Present only with the dev-only token echo enabled.
        expires_at:
          type: string
          format: date-time
          description: Present only with the dev-only token echo enabled.
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 10
          maxLength: 128
          description: Breach-checked before hashing; known-breached passwords are rejected.
    UserList:
      type: object
      required: [users, limit, offset]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        limit:
          type: integer
        offset:
          type: integer
    SessionInfo:
      type: object
      description: One refresh session of the caller (credential-free projection).
      required: [id, device_name, ip_address, created_at, expires_at, absolute_expires_at, current]
      properties:
        id:
          type: string
          format: uuid
        device_name:
          type: string
        ip_address:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Idle expiry, extended by refresh rotation (never past absolute_expires_at).
        absolute_expires_at:
          type: string
          format: date-time
          description: Hard cap set at first login (ADR-0004 hardening, issue #81).
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: When the session was revoked (logout, password change, revoke-all); null while live.
        current:
          type: boolean
          description: True for the session behind the presented access token.
    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionInfo'
    RevokeAllResponse:
      type: object
      required: [revoked]
      properties:
        revoked:
          type: integer
          description: Number of live sessions revoked by this call.
    Problem:
      type: object
      description: RFC 7807-style error (application/problem+json).
      required: [code, title]
      properties:
        code:
          type: string
          description: Stable machine code, e.g. validation_failed, unauthorized, conflict.
        title:
          type: string
        detail:
          type: string
        errors:
          type: array
          description: Field-level issues for validation failures.
          items:
            type: object
            required: [field, issue]
            properties:
              field:
                type: string
              issue:
                type: string
    AuditList:
      type: object
      required: [entries, limit, offset]
      properties:
        entries:
          type: array
          description: One page of audit records, newest first.
          items:
            $ref: '#/components/schemas/AuditEntry'
        limit:
          type: integer
          description: Effective page size after clamping.
        offset:
          type: integer
          description: Effective offset after clamping.
    AuditEntry:
      type: object
      description: >
        One write-once audit record (ADR-0003 append-only rules, ADR-0004
        privileged-action auditing). actor_id and tenant_id are null for
        system-originated or personal rows; metadata carries the
        action-specific attribution (for dispatch decision records: the
        decision inputs hash, chosen technician, chosen score and weight
        set).
      required: [id, action, object_type, object_id, metadata, created_at]
      properties:
        id:
          type: integer
          format: int64
          description: Append-only row sequence number.
        actor_id:
          nullable: true
          type: string
          format: uuid
          description: The acting principal; null for system actors.
        action:
          type: string
          description: >
            Dotted action identifier, e.g. identity.user.registered,
            identity.users.listed, dispatch.decision.scored,
            jobs.assignment.dispatched.
        object_type:
          type: string
        object_id:
          type: string
          description: >
            The acted-on object's identifier, or the literal "collection"
            for collection reads.
        tenant_id:
          nullable: true
          type: string
          format: uuid
        metadata:
          type: object
          description: Action-specific attribution data; never credential material.
          additionalProperties: true
        created_at:
          type: string
          format: date-time
          description: Server-side write time of the audit row.
